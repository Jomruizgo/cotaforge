# Canonical sectors of the memory: every example of the base set names one of these ids. The engineer extends this
# table with a `sectors.yaml` in the memory folder of the project or of the user (same format: new sectors, or
# `aliases` added to an existing id). Aliases are compared without case, accents or punctuation, and work in English
# and in Spanish: the ids before 0.10 (`chapa-metalica`...) stay as aliases, so an old entry still reaches its sector.
sectors:
  - id: fixtures
    name: Fixtures, tooling and gauges
    aliases:
      - dispositivos
      - dispositivo
      - dispositivos de manufactura
      - dispositivos de fijacion
      - utillaje
      - utillajes
      - utiles
