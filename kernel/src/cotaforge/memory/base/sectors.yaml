# Words that fit more than one sector: they are never assigned on their own (the engineer says which one, with an id
# or with another alias).
ambiguous:
  matrices: [injection-molds, sheet-metal]
  troqueles: [sheet-metal, injection-molds]
  dies: [sheet-metal, injection-molds]
