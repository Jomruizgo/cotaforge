name: pages

# Builds the website (docs-site/) with MkDocs.
# - Pull requests: build check only (strict: a broken link or include fails it). Nothing is published.
# - Push to main: builds and deploys to GitHub Pages, but only when the repository is public, so nothing fails while it is
#   private. Before the first deploy, set Settings > Pages > Source to "GitHub Actions".
# No pull_request_target and no secrets.

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/user-manual.md"
      - "docs/manual-usuario.md"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "docs/user-manual.md"
      - "docs/manual-usuario.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install the site tools
        run: python -m pip install -r docs-site/requirements.txt

      - name: Build (strict)
        working-directory: docs-site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - name: Package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/_build

  deploy:
    needs: build
    # Only from main, and only when the repository is public.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
