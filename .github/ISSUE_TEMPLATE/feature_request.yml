name: Feature request
description: Suggest an improvement or a new capability
labels: ["type:feature", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Wait for the maintainer's `status:approved` before you start coding (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do as an engineer, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. A sketch is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      description: If you want to implement it yourself.
      options:
        - Small (under about 200 changed lines)
        - Larger
        - I will not implement it
    validations:
      required: true
